<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0618">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>دردشة</title>
<script>
  // شريط تشخيص: يعرض أي خطأ على الشاشة
  function showDiag(msg) {
    var d = document.getElementById("diag");
    if (!d) {
      d = document.createElement("div"); d.id = "diag";
      d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#c92a2a;color:#fff;padding:8px 12px;font:13px/1.4 sans-serif;white-space:pre-wrap;max-height:40vh;overflow:auto";
      d.onclick = function () { d.remove(); };
      document.body.appendChild(d);
    }
    d.textContent = msg + "  [v9 - اضغط لإغلاق]";
  }
  window.addEventListener("error", function (e) { showDiag("Error: " + (e.message || "script") + " (" + (e.lineno || "?") + ")"); });
  window.addEventListener("unhandledrejection", function (e) { showDiag("Promise: " + ((e.reason && e.reason.message) || e.reason)); });
  setTimeout(function () {
    if (!window.__chatReady) showDiag("الكود لم يبدأ: غالبًا المتصفح أو الشبكة تحجب Firebase.");
  }, 6000);
</script>
<style>
  :root {
    --bg: #07030a; --header: #8a1750; --bubble: rgba(40,16,36,.72);
    --bubble-me: linear-gradient(135deg, rgba(255,92,147,.55), rgba(194,37,92,.5));
    --text: #fdeef5; --muted: #c9a3b8; --accent: #ff8fb8; --bar: rgba(20,6,20,.72);
    --input: rgba(64,24,56,.85); --chip: rgba(255,255,255,.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    background: linear-gradient(120deg, rgba(138,23,80,.88), rgba(86,20,110,.88));
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: #fff; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,.12);
  }
  header .title { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #e67700; transition: background .3s; }
  #dot.on { background: #51cf66; box-shadow: 0 0 8px #51cf66; }
  header .right { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  header .icon-btn {
    background: rgba(255,255,255,.16); border-radius: 50%; width: 34px; height: 34px;
    padding: 0; font-size: 15px; display: flex; align-items: center; justify-content: center;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px;
    scroll-behavior: smooth;
  }
  .day {
    align-self: center; background: var(--chip); color: var(--muted);
    font-size: 12px; padding: 3px 12px; border-radius: 12px; margin: 8px 0 4px;
  }
  .msg {
    max-width: 80%; padding: 8px 12px; border-radius: 14px; background: var(--bubble);
    align-self: flex-start; overflow-wrap: anywhere;
    box-shadow: 0 2px 12px rgba(0,0,0,.35); animation: pop .15s ease-out;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,143,184,.18);
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  .msg.me { background: var(--bubble-me); align-self: flex-end; border-color: rgba(255,255,255,.22); }
  .msg .name { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
  .msg .text { white-space: pre-wrap; font-size: 16px; line-height: 1.45; }
  .msg .text a { color: var(--accent); text-decoration: underline; }
  .msg .meta {
    display: flex; gap: 10px; align-items: center; justify-content: flex-end;
    font-size: 11px; color: var(--muted); margin-top: 3px; direction: ltr;
  }
  .msg .del { background: none; color: var(--muted); padding: 0; font-size: 12px; }
  #empty { margin: auto; color: var(--muted); font-size: 15px; text-align: center; }
  #toBottom {
    position: fixed; left: 16px; bottom: 82px; width: 40px; height: 40px; border-radius: 50%;
    background: #d6336c; color: #fff; font-size: 18px; padding: 0;
    box-shadow: 0 2px 10px rgba(214,51,108,.6);
  }
  #toBottom span {
    position: absolute; top: -6px; right: -6px; background: #fff; color: #c2255c;
    font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  form {
    display: flex; gap: 8px; padding: 10px; align-items: flex-end;
    padding-bottom: calc(10px + env(safe-area-inset-bottom)); background: var(--bar);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  #input {
    flex: 1; padding: 11px 14px; font-size: 16px; border: none; border-radius: 20px;
    outline: none; font-family: inherit; background: var(--input); color: var(--text);
    resize: none; max-height: 120px; line-height: 1.4;
  }
  #input::placeholder { color: #b98ca6; }
  button {
    background: linear-gradient(135deg, #d6336c, #9c2a8c); color: #fff; border: none; border-radius: 22px;
    padding: 0 20px; font-size: 16px; font-family: inherit; cursor: pointer;
  }
  button:active { opacity: .75; }
  #send { height: 44px; padding: 0 16px; }
  .round { width: 42px; height: 42px; padding: 0; font-size: 18px; border-radius: 50%; flex: none; }

  /* ===== شاشة الدخول (سوداء) ===== */
  body.locked > header, body.locked > #messages, body.locked > form { visibility: hidden; }
  #login {
    position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px; color: #fff; z-index: 50;
  }
  #login h1 { font-size: 24px; font-weight: 600; }
  #login .sub { color: #8d8d8d; font-size: 14px; margin-top: -6px; }
  #login input {
    width: 100%; max-width: 320px; padding: 14px; font-size: 17px; border: 1px solid #2c2c2c;
    border-radius: 12px; text-align: center; outline: none; font-family: inherit;
    background: #0d0d0d; color: #fff;
  }
  #login input:focus { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.12); }
  #login button { width: 100%; max-width: 320px; padding: 13px 0; font-weight: 600; border-radius: 12px; background: #fff; color: #000; }
  #login button.link { background: none; color: #8d8d8d; font-size: 13px; padding: 0; width: auto; }
  #loginErr { color: #ff6b6b; min-height: 20px; font-size: 14px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

  /* ===== الوسائط ===== */
  .media { margin: 2px 0 4px; }
  .media.loading {
    display: flex; align-items: center; justify-content: center; min-height: 60px;
    background: var(--chip); border-radius: 8px; font-size: 20px; color: var(--muted);
  }
  .media.image, .media.video { width: min(240px, 60vw); }
  .media.audio { width: min(230px, 62vw); }
  .media img, .media video {
    width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; background: rgba(0,0,0,.25);
  }
  .media video { object-fit: contain; background: #000; }
  .media audio { width: 100%; height: 40px; display: block; }
  #recBar {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--bar); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--chip);
  }
  #recBar .rdot { width: 12px; height: 12px; border-radius: 50%; background: #ff3b5c; animation: blink 1s infinite; }
  #recBar .grow { flex: 1; color: var(--muted); font-size: 14px; }
  #recTime { font-variant-numeric: tabular-nums; direction: ltr; }
  #recBar button { height: 38px; padding: 0 16px; font-size: 15px; }
  #recCancel { background: #6c5b68; }
  @keyframes blink { 50% { opacity: .25; } }
  #toast {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
    background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 14px; z-index: 20; max-width: 88vw; text-align: center;
  }
  #viewer {
    position: fixed; inset: 0; background: rgba(0,0,0,.93); z-index: 30;
    display: flex; align-items: center; justify-content: center;
  }
  #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* ===== رد / تفاعلات / علامة القراءة ===== */
  .msg { cursor: pointer; }
  .quote {
    border-inline-start: 3px solid var(--accent); background: rgba(0,0,0,.25); border-radius: 8px;
    padding: 4px 8px; margin-bottom: 5px; font-size: 13px; cursor: pointer; min-width: 0;
  }
  .quote .qn { color: var(--accent); font-weight: 600; font-size: 12px; }
  .quote .qt { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flash { animation: flash 1.4s ease-out; }
  @keyframes flash { 0%,45% { box-shadow: 0 0 0 3px #ff8fb8, 0 0 20px #ff5c93; } 100% { box-shadow: 0 2px 12px rgba(0,0,0,.35); } }
  .rxrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  button.rx {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); border-radius: 12px;
    padding: 1px 8px; font-size: 13px; color: var(--text);
  }
  button.rx.mine { background: rgba(255,92,147,.38); border-color: #ff8fb8; }
  .tick { font-size: 12px; letter-spacing: -3px; cursor: pointer; padding: 0 2px; }
  .tick.read { color: #4dabf7; }
  .msg .meta .act { background: none; padding: 0 4px; font-size: 13px; color: var(--muted); border-radius: 8px; }
  .msg .meta .act-react { font-size: 16px; }
  .msg .meta .act:active { background: rgba(255,255,255,.15); }
  #replyBar {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: var(--bar); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--chip); border-inline-start: 3px solid var(--accent);
  }
  #replyBar .rb { flex: 1; min-width: 0; }
  #replyBar .rn { color: var(--accent); font-size: 12px; font-weight: 600; }
  #replyBar .rt { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #replyBar button { background: none; font-size: 18px; padding: 0 6px; }
  #sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40;
    display: flex; align-items: flex-end; justify-content: center;
  }
  #sheet .panel {
    width: 100%; max-width: 480px; background: #1c0f1e; border-radius: 20px 20px 0 0;
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,143,184,.25);
  }
  #sheet .emojis { display: flex; justify-content: space-around; gap: 4px; margin-bottom: 8px; }
  #sheet .emojis button {
    background: rgba(255,255,255,.08); border-radius: 50%; width: 42px; height: 42px; padding: 0; font-size: 22px;
  }
  #sheet .emojis button.sel { background: rgba(255,92,147,.4); outline: 2px solid #ff8fb8; }
  #sheet .acts button {
    width: 100%; text-align: start; background: rgba(255,255,255,.07); border-radius: 12px;
    padding: 13px 16px; margin-top: 8px; font-size: 16px;
  }

  /* ===== الخلفية الرومانسية المتحركة ===== */
  #bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  body.locked #bg, body.locked #bg * { animation-play-state: paused !important; }
  #bg .flow {
    position: absolute; inset: 0;
    background: linear-gradient(125deg, #05010a, #2a0a2e, #4a0d2e, #1a0630, #3a0a22, #05010a);
    background-size: 400% 400%; animation: flow 30s ease-in-out infinite;
  }
  @keyframes flow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  #bg .orb {
    position: absolute; border-radius: 50%; filter: blur(60px); opacity: .38;
    animation: drift 22s ease-in-out infinite alternate; will-change: transform;
  }
  #bg .o1 { width: 300px; height: 300px; top: -80px; left: -60px; background: #ff3d81; }
  #bg .o2 { width: 340px; height: 340px; top: 32%; right: -120px; background: #9c36ff; animation-duration: 28s; animation-delay: -6s; }
  #bg .o3 { width: 280px; height: 280px; bottom: -90px; left: 6%; background: #ff1f4b; animation-duration: 25s; animation-delay: -12s; }
  #bg .o4 { width: 220px; height: 220px; top: 56%; left: 32%; background: #ff6bd6; animation-duration: 32s; animation-delay: -3s; }
  @keyframes drift {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(50px,-70px) scale(1.18); }
    100% { transform: translate(-40px,60px) scale(.95); }
  }

  #bg .moon {
    position: absolute; top: 74px; right: 24px; width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff7fb, #ffc1da 60%, #ff8fb8);
    box-shadow: 0 0 36px 10px rgba(255,143,184,.45), 0 0 110px 36px rgba(194,37,92,.3);
    opacity: .9; animation: moonGlow 6s ease-in-out infinite;
  }
  @keyframes moonGlow { 50% { box-shadow: 0 0 52px 16px rgba(255,143,184,.6), 0 0 140px 50px rgba(194,37,92,.4); } }

  #bg .bigheart {
    position: absolute; left: 50%; top: 46%; font-size: min(72vw, 380px); line-height: 1;
    color: #ff2d6f; opacity: .075; filter: blur(2px);
    transform: translate(-50%,-50%); animation: heartbeat 2.6s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    14%     { transform: translate(-50%,-50%) scale(1.08); }
    28%     { transform: translate(-50%,-50%) scale(1); }
    42%     { transform: translate(-50%,-50%) scale(1.12); }
  }

  #bg .star {
    position: absolute; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px 1px rgba(255,200,225,.85); opacity: .1;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .08; transform: scale(.7); } 50% { opacity: .95; transform: scale(1.3); } }

  #bg .heart {
    position: absolute; bottom: -60px; opacity: 0; color: #ff5c93;
    text-shadow: 0 0 12px rgba(255,92,147,.9); animation: heartUp linear infinite; will-change: transform;
  }
  @keyframes heartUp {
    0%   { transform: translate(0,0) rotate(-12deg) scale(.7); opacity: 0; }
    10%  { opacity: .85; }
    25%  { transform: translate(var(--sx),-30vh) rotate(10deg) scale(1); }
    50%  { transform: translate(calc(var(--sx) * -1),-60vh) rotate(-8deg) scale(1.1); }
    75%  { transform: translate(var(--sx),-90vh) rotate(8deg) scale(1); }
    100% { transform: translate(0,-125vh) rotate(-10deg) scale(.8); opacity: 0; }
  }

  #bg .petal {
    position: absolute; top: -30px; width: 12px; height: 16px; opacity: .8;
    background: radial-gradient(circle at 30% 30%, #ff7aa8, #c2185b);
    border-radius: 150% 0 150% 0; animation: petalFall linear infinite;
  }
  @keyframes petalFall {
    0%   { transform: translate(0,-5vh) rotate(0deg); }
    25%  { transform: translate(40px,25vh) rotate(120deg); }
    50%  { transform: translate(-30px,55vh) rotate(240deg); }
    75%  { transform: translate(35px,85vh) rotate(330deg); }
    100% { transform: translate(-10px,112vh) rotate(420deg); opacity: .2; }
  }

  #bg .shoot {
    position: absolute; top: 14%; left: -20%; width: 150px; height: 2px; opacity: 0;
    background: linear-gradient(90deg, transparent, #ffd1e3); transform: rotate(24deg);
    animation: shoot 12s linear infinite;
  }
  @keyframes shoot {
    0%, 88% { opacity: 0; transform: translate(0,0) rotate(24deg); }
    90%     { opacity: 1; }
    100%    { opacity: 0; transform: translate(120vw, 55vh) rotate(24deg); }
  }
  @media (prefers-reduced-motion: reduce) { #bg, #bg * { animation: none !important; } }
  .hidden { display: none !important; }
</style>
</head>
<body class="locked">

<div id="bg" aria-hidden="true">
  <div class="flow"></div>
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="orb o3"></div><div class="orb o4"></div>
  <div class="bigheart">❤</div>
  <div class="moon"></div>
  <div class="shoot"></div>
</div>

<div id="login">
  <h1>تسجيل الدخول</h1>
  <p class="sub">اكتب اسم المستخدم والكود</p>
  <input id="userInput" type="text" placeholder="اسم المستخدم" maxlength="20" autocomplete="off" autocapitalize="off">
  <input id="codeInput" type="password" placeholder="الكود" autocomplete="off" autocapitalize="off">
  <button id="enterBtn">دخول</button>
  <div id="loginErr"></div>
  <button id="showCode" class="link" type="button">إظهار الكود</button>
</div>

<header>
  <div class="title"><span id="dot" title="حالة الاتصال"></span> 💞 محادثتنا <small style="opacity:.6;font-size:10px;font-weight:400">v9</small></div>
  <div class="right">
    <span id="who"></span>
    <button class="icon-btn" id="soundBtn" title="الصوت">🔔</button>
    <button class="icon-btn" id="clearBtn" title="حذف المحادثة كاملة">🗑</button>
    <button class="icon-btn" id="logoutBtn" title="تسجيل الخروج">🚪</button>
  </div>
</header>

<div id="messages"><div id="empty">لا توجد رسائل بعد، ابدأ المحادثة 💕</div></div>
<button id="toBottom" class="hidden" aria-label="للأسفل">⬇<span id="badge" class="hidden">0</span></button>

<div id="replyBar" class="hidden">
  <div class="rb"><div class="rn" id="replyName"></div><div class="rt" id="replyText"></div></div>
  <button type="button" id="replyCancel" aria-label="إلغاء الرد">✕</button>
</div>

<div id="recBar" class="hidden">
  <span class="rdot"></span><span id="recTime">0:00</span><span class="grow">جاري التسجيل...</span>
  <button type="button" id="recCancel">إلغاء</button>
  <button type="button" id="recSend">إرسال</button>
</div>

<form id="form">
  <input type="file" id="file" accept="image/*,video/*" hidden>
  <button type="button" id="attach" class="round" aria-label="إرفاق صورة أو فيديو">📎</button>
  <textarea id="input" rows="1" placeholder="اكتب رسالة..." maxlength="1000"></textarea>
  <button type="button" id="mic" class="round" aria-label="تسجيل صوتي">🎤</button>
  <button type="submit" id="send">إرسال</button>
</form>

<div id="toast" class="hidden"></div>
<div id="viewer" class="hidden"><img id="viewerImg" alt=""></div>

<div id="sheet" class="hidden">
  <div class="panel">
    <div class="emojis" id="sheetEmojis"></div>
    <div class="acts">
      <button type="button" id="actReply">↩ رد</button>
      <button type="button" id="actCopy">📋 نسخ النص</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getDatabase, ref, push, set, remove, onChildAdded, onChildRemoved, onChildChanged, onValue,
    query, limitToLast, serverTimestamp, get
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCShtafvKKuF3NWJmS_nTLIQv2MIThT77c",
    authDomain: "univ-6406b.firebaseapp.com",
    databaseURL: "https://univ-6406b-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "univ-6406b",
    storageBucket: "univ-6406b.firebasestorage.app",
    messagingSenderId: "934802646244",
    appId: "1:934802646244:web:56b78ad2d1d395378ab8f1"
  };

  window.__chatReady = true;
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, "messages");

  const $ = (id) => document.getElementById(id);
  const box = $("messages");
  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  // ---------- عناصر الخلفية: قلوب وبتلات ونجوم ----------
  (function () {
    const bg = $("bg");
    const r = (a, b) => a + Math.random() * (b - a);
    const hearts = ["❤", "💖", "💗", "💕", "♥", "💘"];
    for (let i = 0; i < 40; i++) {
      const s = document.createElement("i");
      s.className = "star";
      const z = r(1.5, 3.5);
      s.style.cssText = `left:${r(0,100)}%;top:${r(0,100)}%;width:${z}px;height:${z}px;animation-delay:-${r(0,4)}s;animation-duration:${r(2,5)}s`;
      bg.appendChild(s);
    }
    for (let i = 0; i < 18; i++) {

  function updateBadge() {
    $("badge").textContent = unseen;
    $("badge").classList.toggle("hidden", unseen === 0);
    $("toBottom").classList.toggle("hidden", isNearBottom());
  }

  function resetChat() {
    box.innerHTML = '<div id="empty">لا توجد رسائل بعد، ابدأ المحادثة 💕</div>';
    lastDay = ""; unseen = 0; mediaCache.clear(); msgs.clear(); updateBadge();
  }

  function addMessage(key, m) {
    if ($("empty")) $("empty").remove();
    const mine = m.name === myName;
    const wasBottom = isNearBottom();

    const ts = m.ts || Date.now() + serverOffset;
    const dl = dayLabel(ts);
    if (dl !== lastDay) {
      const s = document.createElement("div");
      s.className = "day"; s.textContent = dl; box.appendChild(s);
      lastDay = dl;
    }

    const div = document.createElement("div");
    div.className = "msg" + (mine ? " me" : "");
    if (!mine) {
      const n = document.createElement("div");
      n.className = "name"; n.textContent = m.name; div.appendChild(n);
    }
    if (m.reply) {
      const q = document.createElement("div");
      q.className = "quote";
      const qn = document.createElement("div"); qn.className = "qn"; qn.textContent = m.reply.name;
      const qt = document.createElement("div"); qt.className = "qt"; qt.textContent = m.reply.text;
      q.appendChild(qn); q.appendChild(qt);
      q.onclick = () => jumpTo(m.reply.key);
      div.appendChild(q);
    }
    if (m.mediaId) div.appendChild(makeMediaSlot(m));
    if (m.text) {
      const t = document.createElement("div");
      t.className = "text"; t.appendChild(linkify(String(m.text))); div.appendChild(t);
    }

    const rxRow = document.createElement("div");
    rxRow.className = "rxrow hidden";
    div.appendChild(rxRow);

    const meta = document.createElement("div");
    meta.className = "meta";
    const bReact = document.createElement("button");
    bReact.type = "button"; bReact.className = "act act-react"; bReact.textContent = "😊"; bReact.title = "تفاعل";
    bReact.onclick = () => openSheet(key);
    const bReply = document.createElement("button");
    bReply.type = "button"; bReply.className = "act act-reply"; bReply.textContent = "↩ رد"; bReply.title = "رد على الرسالة";
    bReply.onclick = () => setReply(key);
    meta.appendChild(bReact); meta.appendChild(bReply);
    if (mine) {
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "🗑 حذف";
      del.onclick = () => {
        if (!confirm("حذف هذه الرسالة؟")) return;
        remove(ref(db, "messages/" + key));
        if (m.mediaId) remove(ref(db, "media/" + m.mediaId));
      };
      meta.appendChild(del);
    }
    const tm = document.createElement("span");
    tm.textContent = new Date(ts).toLocaleTimeString("fr-DZ", { hour: "2-digit", minute: "2-digit" });
    meta.appendChild(tm);
    let tick = null;
    if (mine) {
      tick = document.createElement("span");
      tick.className = "tick"; tick.textContent = "✓";
      tick.onclick = () => showReaders(key);
      meta.appendChild(tick);
    }
    div.appendChild(meta);
    div.addEventListener("click", (ev) => {
      if (ev.target.closest("button, a, img, audio, video, .quote, .tick")) return;
      if (String(window.getSelection && window.getSelection()).length) return;
      openSheet(key);
    });

    box.appendChild(div);
    nodes.set(key, div);
    msgs.set(key, { div, m, tick, rxRow });
    renderReactions(key);
    updateTicks();

    const isNew = m.ts && m.ts > loadTime + serverOffset - 3000;
    if (mine || wasBottom) scrollBottom(isNew);
    else if (isNew) unseen++;

    if (!mine && isNew) {
      if (soundOn) beep();
      if (document.hidden) { hiddenCount++; document.title = `(${hiddenCount}) ${baseTitle}`; }
      if (navigator.vibrate) navigator.vibrate(60);
    }
    if (!mine && wasBottom) markRead();
    updateBadge();
  }

  let listening = false;
  function listen() {
    if (listening) return;
    listening = true;
    const q = query(messagesRef, limitToLast(200));
    onChildAdded(q, (snap) => addMessage(snap.key, snap.val()), (err) => {
      alert("تعذّرت قراءة الرسائل: " + err.message + "\n\nتحقق من قواعد Firebase (Règles).");
    });
    onChildChanged(q, (snap) => {
      const e = msgs.get(snap.key);
      if (!e) return;
      e.m = snap.val();
      renderReactions(snap.key);
      updateTicks();
    });
    onChildRemoved(q, (snap) => {
      const el = nodes.get(snap.key);
      if (el) { el.remove(); nodes.delete(snap.key); }
      msgs.delete(snap.key);
      if (nodes.size === 0) resetChat();
    });
    setTimeout(() => scrollBottom(false), 600);
    setTimeout(markRead, 1200);
  }

  box.addEventListener("scroll", () => { if (isNearBottom()) { unseen = 0; markRead(); } updateBadge(); });
  $("toBottom").onclick = () => { scrollBottom(); unseen = 0; updateBadge(); markRead(); };
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { hiddenCount = 0; document.title = baseTitle; if (isNearBottom()) markRead(); }
  });

  // ---------- إرسال الرسائل النصية ----------
  const input = $("input");
  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  }
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android|iPhone/i.test(navigator.userAgent)) {
      e.preventDefault(); $("form").requestSubmit();
    }
  });
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !myName) return;
    const payload = { name: myName, text, ts: serverTimestamp() };
    if (replyTo) payload.reply = replyTo;
    push(messagesRef, payload).catch((err) => {
      alert("فشل الإرسال: " + err.message + "\n\nالسبب غالبًا قواعد Firebase (Règles) لا تسمح بالكتابة.");
      input.value = text; autoGrow();
    });
    input.value = ""; autoGrow(); clearReply(); input.focus();
  });
</script>
</body>
</html>
