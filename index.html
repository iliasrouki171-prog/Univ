<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7285">
<title>دردشة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #e9edef;
    display: flex; flex-direction: column;
    height: 100dvh;
  }
  header {
    background: #0b7285; color: #fff;
    padding: 14px 16px; font-size: 18px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  header small { font-weight: 400; font-size: 13px; opacity: .85; }
  #messages {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .msg {
    max-width: 80%; padding: 8px 12px; border-radius: 12px;
    background: #fff; align-self: flex-start;
    word-wrap: break-word; overflow-wrap: anywhere;
    box-shadow: 0 1px 1px rgba(0,0,0,.1);
  }
  .msg.me { background: #d3f0f5; align-self: flex-end; }
  .msg .name { font-size: 12px; color: #0b7285; font-weight: 600; margin-bottom: 2px; }
  .msg .text { white-space: pre-wrap; font-size: 16px; line-height: 1.4; }
  .msg .time { font-size: 11px; color: #777; margin-top: 3px; text-align: left; direction: ltr; }
  form {
    display: flex; gap: 8px; padding: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: #f0f2f5;
  }
  #input {
    flex: 1; padding: 12px 14px; font-size: 16px;
    border: none; border-radius: 22px; outline: none;
    font-family: inherit;
  }
  button {
    background: #0b7285; color: #fff; border: none;
    border-radius: 22px; padding: 0 20px; font-size: 16px;
    font-family: inherit; cursor: pointer;
  }
  button:active { opacity: .8; }
  #login {
    position: fixed; inset: 0; background: #0b7285;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px; color: #fff; z-index: 10;
  }
  #login h1 { font-size: 24px; }
  #login input {
    width: 100%; max-width: 320px; padding: 14px; font-size: 17px;
    border: none; border-radius: 12px; text-align: center; outline: none;
    font-family: inherit;
  }
  #login button { background: #fff; color: #0b7285; padding: 12px 36px; font-weight: 600; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login">
  <h1>مرحبًا 👋</h1>
  <p>اكتب اسمك للدخول إلى الدردشة</p>
  <input id="nameInput" type="text" placeholder="اسمك" maxlength="20" autocomplete="off">
  <button id="enterBtn">دخول</button>
</div>

<header>
  <span>💬 الدردشة</span>
  <small id="who"></small>
</header>

<div id="messages"></div>

<form id="form">
  <input id="input" type="text" placeholder="اكتب رسالة..." autocomplete="off" maxlength="1000">
  <button type="submit">إرسال</button>
</form>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getDatabase, ref, push, onChildAdded, query, limitToLast, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCShtafvKKuF3NWJmS_nTLIQv2MIThT77c",
    authDomain: "univ-6406b.firebaseapp.com",
    databaseURL: "https://univ-6406b-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "univ-6406b",
    storageBucket: "univ-6406b.firebasestorage.app",
    messagingSenderId: "934802646244",
    appId: "1:934802646244:web:56b78ad2d1d395378ab8f1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, "messages");

  const $ = (id) => document.getElementById(id);
  const box = $("messages");

  // ---- الاسم ----
  let myName = "";
  try { myName = localStorage.getItem("chat_name") || ""; } catch (e) {}

  function startChat() {
    $("login").classList.add("hidden");
    $("who").textContent = myName;
    listen();
  }

  if (myName) {
    startChat();
  } else {
    $("enterBtn").onclick = () => {
      const n = $("nameInput").value.trim();
      if (!n) return;
      myName = n;
      try { localStorage.setItem("chat_name", n); } catch (e) {}
      startChat();
    };
    $("nameInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("enterBtn").click();
    });
  }

  // ---- استقبال الرسائل ----
  let listening = false;
  function listen() {
    if (listening) return;
    listening = true;
    onChildAdded(query(messagesRef, limitToLast(200)), (snap) => {
      addMessage(snap.val());
    });
  }

  function addMessage(m) {
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    const div = document.createElement("div");
    div.className = "msg" + (m.name === myName ? " me" : "");

    if (m.name !== myName) {
      const n = document.createElement("div");
      n.className = "name";
      n.textContent = m.name;
      div.appendChild(n);
    }
    const t = document.createElement("div");
    t.className = "text";
    t.textContent = m.text;          // textContent يمنع حقن الأكواد
    div.appendChild(t);

    if (m.ts) {
      const tm = document.createElement("div");
      tm.className = "time";
      tm.textContent = new Date(m.ts).toLocaleTimeString("fr-DZ", { hour: "2-digit", minute: "2-digit" });
      div.appendChild(tm);
    }
    box.appendChild(div);
    if (nearBottom || m.name === myName) box.scrollTop = box.scrollHeight;
  }

  // ---- إرسال ----
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text || !myName) return;
    push(messagesRef, { name: myName, text, ts: serverTimestamp() });
    $("input").value = "";
    $("input").focus();
  });
</script>
</body>
</html>
